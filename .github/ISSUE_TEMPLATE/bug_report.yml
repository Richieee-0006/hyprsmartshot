name: Bug Report
description: Report an issue or unexpected behavior in HyprSmartShot
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you have tested the latest commit on `main`.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `hyprsmartshot universal`
        2. Hover over [Game / Window / Inventory Slot]
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: hyprland-version
    attributes:
      label: Hyprland Version
      description: Output of `hyprctl version`
      placeholder: "e.g. Hyprland 0.45.0"
    validations:
      required: true

  - type: input
    id: quickshell-version
    attributes:
      label: QuickShell Version
      description: Output of `quickshell --version`
      placeholder: "e.g. quickshell 0.0.9"
    validations:
      required: true

  - type: input
    id: gpu-driver
    attributes:
      label: GPU & Driver
      description: Your GPU model and driver version (AMD / Intel / NVIDIA)
      placeholder: "e.g. AMD Radeon 780M / mesa 24.2"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs & Output
      description: Any terminal output or logs from `hyprsmartshot`
      render: shell
    validations:
      required: false
