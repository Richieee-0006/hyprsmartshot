name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Package & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="hyprsmartshot-${VERSION}.tar.gz"
          tar --exclude="./.git*" --exclude="./.venv*" --exclude="**/__pycache__" --exclude="./*.tmp*" --exclude="./*.sha256" -czf "/tmp/$ARCHIVE" .
          mv "/tmp/$ARCHIVE" .
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            hyprsmartshot-*.tar.gz
            hyprsmartshot-*.tar.gz.sha256
          generate_release_notes: true
