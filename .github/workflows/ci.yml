name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Test Python Detector & i18n
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy

      - name: Run Computer Vision unit tests
        run: |
          python -m unittest discover -s vision

      - name: Run Localization (i18n) unit tests
        run: |
          python3 tests/test_i18n.py

  validate-translations:
    name: Validate Translation JSONs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          for f in localization/*.json config/hyprsmartshot/*.json; do
            if [ -f "$f" ]; then
              python3 -m json.tool "$f" > /dev/null
              echo "✓ $f is valid JSON"
            fi
          done

  lint-shell:
    name: Shell Scripts Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check bash script syntax
        run: |
          bash -n bin/hyprsmartshot
          bash -n install.sh
          echo "✓ Bash scripts syntax validated"
