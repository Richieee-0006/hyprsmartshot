name: CI

on:
  push:
    branches: [ main, "feature/**", "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Test Python Detector & i18n
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Computer Vision unit tests
        run: |
          python -m unittest discover -s vision

      - name: Run CLI and Localization (i18n) unit tests
        run: |
          python -m unittest discover -s tests

  validate-translations:
    name: Validate Translation JSONs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate JSON syntax and key parity
        run: |
          python3 scripts/localization_template.py --check
          for f in config/hyprsmartshot/*.json; do
            if [ -f "$f" ]; then
              python3 -m json.tool "$f" > /dev/null
              echo "[OK] $f is valid JSON"
            fi
          done

  lint-shell:
    name: Shell Scripts Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check bash script syntax and desktop file
        run: |
          bash -n bin/hyprsmartshot
          bash -n install.sh
          bash -n packaging/arch/PKGBUILD
          bash -n packaging/arch/PKGBUILD-git
          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate packaging/arch/hyprsmartshot.desktop
          fi
          echo "[OK] Shell scripts, PKGBUILDs, and desktop entries validated"
