name: CI

on:
  push:
    branches: [ main, "feature/**", "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-cpp:
    name: Build & Test Native C++23 Standalone
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native C++23 & Wayland dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config g++ \
            libwayland-dev wayland-protocols libwayland-bin \
            libcairo2-dev libpango1.0-dev libxkbcommon-dev \
            libpng-dev libjpeg-dev libcurl4-openssl-dev \
            nlohmann-json3-dev libopencv-dev libgtk-4-dev \
            libsystemd-dev

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=ON \
            -DBUILD_SETTINGS_GUI=ON
          cmake --build build -j$(nproc)

      - name: Run C++ Unit & CLI Tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify CMake Install Staging
        run: |
          DESTDIR=/tmp/hss-stage cmake --install build --prefix /usr
          test -x /tmp/hss-stage/usr/bin/hyprsmartshot
          test -L /tmp/hss-stage/usr/bin/hyprsmartshot-pin
          test -x /tmp/hss-stage/usr/bin/hyprsmartshot-settings
          test -f /tmp/hss-stage/usr/lib/hyprsmartshot/libhss_vision.so || test -f /tmp/hss-stage/usr/lib/x86_64-linux-gnu/hyprsmartshot/libhss_vision.so
          rm -rf /tmp/hss-stage

  test-python:
    name: Test Reference Python Detector & i18n
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Computer Vision unit tests
        run: |
          python -m unittest discover -s vision

      - name: Run CLI and Localization (i18n) unit tests
        run: |
          python -m unittest discover -s tests

  validate-translations:
    name: Validate Translation JSONs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate JSON syntax and key parity
        run: |
          python3 scripts/localization_template.py --check
          for f in config/hyprsmartshot/*.json; do
            if [ -f "$f" ]; then
              python3 -m json.tool "$f" > /dev/null
              echo "[OK] $f is valid JSON"
            fi
          done

  lint-shell:
    name: Shell Scripts & Packaging Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check bash script syntax and desktop file
        run: |
          bash -n bin/hyprsmartshot
          bash -n install.sh
          bash -n packaging/arch/PKGBUILD
          bash -n packaging/arch/PKGBUILD-git
          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate packaging/arch/hyprsmartshot.desktop
          fi
          echo "[OK] Shell scripts, PKGBUILDs, and desktop entries validated"
